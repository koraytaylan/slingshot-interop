# The one place every container base image the tiers run on is pinned, by
# content digest: a tag moves, a digest does not. Each row records the exact
# bytes scripts/prepare_interop_images fetches — by full digest-pinned
# reference, never by tag — and scripts/verify_interop_images verifies
# offline, naming this file's preparation command on any absence. It also
# builds the one Containerfile this pinning records and records its built
# identifier. Every value carries its reason, and no other file restates any
# of it.

# [client-runner] records the client half's built image the same way: built
# once from the pinned glibc base, and verified offline by this row's name
# and recorded identifier. The release executable is mounted in at run time
# and never baked in, so the build has nothing else in it.

[client-runner]
name = "localhost/slingshot-interop-client-runner"
tag = "pinned"
# Reason: the built identifier is recorded by the preparation command after
# the build and is explicitly absent until then, like a released slot: the
# gate refuses an absent build by naming the preparation command, and this
# file stays the one place the built image is named.
identifier = "sha256:f9cc75bd927165d5004d56ac5b569b8c03fab0a100551690d98d7a886838ad6f"

[tier-sling]
name = "localhost/slingshot-interop-tier-sling"
tag = "pinned"
# Reason: the built identifier is recorded by the preparation command after
# the build and is explicitly absent until then, like a released slot: the
# gate refuses an absent build by naming the preparation command, and this
# file stays the one place the built image is named.
identifier = "sha256:a3be64b4e918351dd602223280ebaf0dc0d7223ad32f4260311eb64a829d7321"

# [severance-proxy] records the disruption half's built image: the pinned
# glibc base carrying the pinned Bun binary and the proxy's own source. The
# preparation command builds it once and records its identifier exactly the
# way it records the tier-sling build's.
[severance-proxy]
name = "localhost/slingshot-interop-severance-proxy"
tag = "pinned"
# Reason: the built identifier is recorded by the preparation command after
# the build and is explicitly absent until then, like a released slot: the
# gate refuses an absent build by naming the preparation command, and this
# file stays the one place the built image is named.
identifier = "sha256:616ab3e5eb65f5a3138669cccb0004919d0a45b7ffd50a3ba84a2749f4269b98"

[probe]

# Reason: the harness proves its own container lifecycle against this image,
# so its assertions never wait for somebody else's runtime to become ready;
# a tiny image with a controllable exit and output is what the lifecycle and
# readiness tests need and nothing more.
reference = "docker.io/library/busybox@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f"
name = "docker.io/library/busybox"
digest = "sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f"

# Reason: the digest above is the linux/amd64 manifest, the only platform the
# rootless Podman runs of this harness execute on; recorded so a future
# re-record knows which manifest the bytes were taken from.
platform = "linux/amd64"

[glibc]

# Reason: the client runner's base. The release executable is mounted in,
# never baked in, so the base has to carry the glibc the Linux release row
# links against — the release is built on ubuntu-24.04, whose glibc is
# 2.39, so a base with an older glibc refuses the executable before anything
# starts — and a platform trust store the daemon's startup snapshot reads.
reference = "docker.io/library/debian@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1"
name = "docker.io/library/debian"
digest = "sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1"
platform = "linux/amd64"

[sling-runtime]

# Reason: the published Apache Sling runtime the author side starts and the
# resolved Sling-only bundle is installed into through the platform's own
# console route; pinned as published so the author half runs on the same
# public bytes a user of the platform would.
reference = "docker.io/apache/sling@sha256:8722cd66ae0758e50784ac21df836c8f8d9e443d105e1a4292a4cb7f810a8cc9"
name = "docker.io/apache/sling"
digest = "sha256:8722cd66ae0758e50784ac21df836c8f8d9e443d105e1a4292a4cb7f810a8cc9"
platform = "linux/amd64"

[java-runtime]

# Reason: the Java 21 runtime the agent's deployment rows declare. It is
# layered over the published Sling runtime rather than inherited from it,
# because the published image's runtime and ASM cannot read what this side
# compiles — the same reason the agent's own tier layers it.
reference = "docker.io/library/eclipse-temurin@sha256:4cfc63a7118da9267c17e2c988e1599d83d5d64a3832a760f0e77c7e8f6b29f7"
name = "docker.io/library/eclipse-temurin"
digest = "sha256:4cfc63a7118da9267c17e2c988e1599d83d5d64a3832a760f0e77c7e8f6b29f7"
platform = "linux/amd64"
